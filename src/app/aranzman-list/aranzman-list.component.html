<mat-card class="table-container">
  <h2>Aranžmani</h2>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let a">{{ a.id }}</td>
    </ng-container>

    <ng-container matColumnDef="naziv">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Naziv</th>
      <td mat-cell *matCellDef="let a">{{ a.naziv }}</td>
    </ng-container>

    <ng-container matColumnDef="opis">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Opis</th>
      <td mat-cell *matCellDef="let a">{{ a.opis }}</td>
    </ng-container>

    <ng-container matColumnDef="cena">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cena</th>
      <td mat-cell *matCellDef="let a">{{ a.cena | currency:'EUR' }}</td>
    </ng-container>

    <ng-container matColumnDef="aktivan">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Aktivan</th>
      <td mat-cell *matCellDef="let a">{{ a.aktivan ? 'DA' : 'NE' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="5"></mat-paginator>
</mat-card>
