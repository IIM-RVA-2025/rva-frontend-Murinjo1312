<header class="app-header">
  <div class="header-content">
    <mat-icon class="header-icon">travel_explore</mat-icon>
    <h1>Turistička Agencija</h1>
  </div>
</header>

<mat-sidenav-container>
  <mat-sidenav class="nav-color" #sidenav [fixedInViewport]="true" mode="side" opened>
    <mat-accordion multi>

      <mat-expansion-panel hideToggle="false" expanded="true">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-icon class="blue">flight_takeoff</mat-icon>
            Aplikacija
          </mat-panel-title>
          <mat-panel-description>
            Turistička agencija
          </mat-panel-description>
        </mat-expansion-panel-header>

        <mat-nav-list>
          <a mat-button class="blue-button" [routerLink]="['/putnici']">Putnici</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button class="blue-button" [routerLink]="['/aranzmani']">Aranžmani</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button class="blue-button" [routerLink]="['/destinacije']">Destinacije</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button class="blue-button" [routerLink]="['/rezervacije']">Rezervacije</a>
        </mat-nav-list>
      </mat-expansion-panel>

      <mat-expansion-panel hideToggle="false" expanded="true">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-icon class="blue">info</mat-icon>
            Informacije
          </mat-panel-title>
          <mat-panel-description>
            O aplikaciji
          </mat-panel-description>
        </mat-expansion-panel-header>

        <mat-nav-list>
          <a mat-button class="blue-button" href="/home#home">Početna</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button class="blue-button" href="/home#about">O nama</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button class="blue-button" href="/home#contact">Kontakt</a>
        </mat-nav-list>
      </mat-expansion-panel>

    </mat-accordion>
  </mat-sidenav>

  <router-outlet></router-outlet>
</mat-sidenav-container>
