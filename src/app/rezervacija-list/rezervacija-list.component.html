<mat-card class="table-container">
  <h2>Rezervacije</h2>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let r">{{ r.id }}</td>
    </ng-container>

    <ng-container matColumnDef="datum_rezervacije">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Datum rezervacije</th>
      <td mat-cell *matCellDef="let r">{{ r.datum_rezervacije | date: 'dd.MM.yyyy.' }}</td>
    </ng-container>

    <ng-container matColumnDef="ukupna_cena">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ukupna cena</th>
      <td mat-cell *matCellDef="let r">{{ r.ukupna_cena | currency:'EUR' }}</td>
    </ng-container>

    <ng-container matColumnDef="potvrdjena">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Potvrđena</th>
      <td mat-cell *matCellDef="let r">{{ r.potvrdjena ? 'DA' : 'NE' }}</td>
    </ng-container>

    <ng-container matColumnDef="putnik_id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Putnik ID</th>
      <td mat-cell *matCellDef="let r">{{ r.putnik_id }}</td>
    </ng-container>

    <ng-container matColumnDef="aranzman_id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Aranžman ID</th>
      <td mat-cell *matCellDef="let r">{{ r.aranzman_id }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="5"></mat-paginator>
</mat-card>
